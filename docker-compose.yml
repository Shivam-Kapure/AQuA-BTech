services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in the environment}
      MONGODB_URI: mongodb://mongo:27017
      DB_NAME: agentic_testing
      HTTP_VERIFY_TLS: "true"
      ALLOW_PRIVATE_TARGETS: "false"
      ARTIFACT_RETENTION_DAYS: "30"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: [security]
    entrypoint: ["zap.sh"]
    command: ["-daemon", "-host", "0.0.0.0", "-port", "8090"]

volumes:
  mongo_data:
